{% load i18n %}
<form action="{% url 'set_language' %}" method="post" class="language-selector" style="display: inline-flex; align-items: center; gap: 0.35rem;">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <label for="language-selector" class="visually-hidden">{% translate "Language" %}</label>
    <select id="language-selector" name="language" aria-label="{% translate 'Language' %}" onchange="this.form.submit()">
        {% get_available_languages as available_languages %}
        {% for language_code, language_name in available_languages %}
        <option value="{{ language_code }}"{% if language_code == LANGUAGE_CODE %} selected{% endif %}>{{ language_name }}</option>
        {% endfor %}
    </select>
    <button type="submit">{% translate "Change language" %}</button>
</form>
